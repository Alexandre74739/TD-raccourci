services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: raccourcis
      POSTGRES_USER: raccourcis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raccourcis}
    volumes:
      - db-data:/var/lib/postgresql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raccourcis -d raccourcis"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    image: ghcr.io/alexandre74739/shortcuts-back
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://raccourcis:${POSTGRES_PASSWORD:-raccourcis}@db:5432/raccourcis
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/alexandre74739/shortcuts-front
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:5000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  db-data:
